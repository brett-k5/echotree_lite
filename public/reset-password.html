<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - EchoTree Lite</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <main>
    <h1>Reset Your Password</h1>

    <div id="reset-container">
      <input type="email" id="reset-email-input" placeholder="Enter your email" required />

      <button id="send-reset-link-button">Send Reset Link</button>
      
      <div id="reset-message" style="color: green; margin-top: 10px;"></div>
      <div id="reset-error" style="color: red; margin-top: 10px;"></div>

      <p style="margin-top: 10px; font-size: 0.9em;">
        After submitting your email, check your inbox for a password reset link. 
        You will be able to choose a new password from that email.
      </p>
    </div>
  </main>

  <script type="module" src="/src/reset-password.ts"></script>
</body>
</html>
