<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoTree Lite Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    #sign-out-button {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 6px 12px;
    }
  </style>
</head>
<body>
  <!-- Sign out button fixed top-right -->
  <button id="sign-out-button">Sign Out</button>

  <header>
    <h1 id="echo-header">Echo Profile</h1>
    <div id="usage-bar">
      Voice Usage: <span id="used-minutes">0</span> / 5 minutes
    </div>
    <!-- Inline usage message for warnings -->
    <div id="usage-message" style="color: red; margin-top: 5px;"></div>
  </header>

  <main id="chat-window">
    <!-- Messages will go here -->
  </main>

  <footer>
    <input type="text" id="user-input" placeholder="Ask something..." />
    <button id="send-button">Send</button>
    <button id="subscription-button">Subscription Options</button>
  </footer>

  <script src="/dist/chat.js" type="module"></script>
</body>
</html>
