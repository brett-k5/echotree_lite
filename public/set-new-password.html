<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password - EchoTree Lite</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <main>
    <h1>Set Your New Password</h1>

    <div id="reset-container">
      <input type="password" id="new-password-input" placeholder="New Password" required />
      <input type="password" id="confirm-password-input" placeholder="Confirm Password" required />

      <button id="set-password-button">Set Password</button>

      <div id="reset-error" style="color: red; margin-top: 5px;"></div>
      <div id="reset-message" style="color: green; margin-top: 5px;"></div>
    </div>
  </main>

  <script type="module" src="/src/set-new-password.ts"></script>
</body>
</html>
