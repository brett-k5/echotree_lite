<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Plan Choice - EchoTree Lite</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main>
    <h1>Payment Plans</h1>

    <section id="payment-plan-choice">

      <button id="monthly-subscription">Monthly Subscription: $0.01 per month</button>
      <button id="annual-subscription">Annual Subscription: $0.03 per year</button>
      <button id="permanent-access">Permanent Access: $0.05 one time payment</button>

      <p style="margin-top: 10px; font-size: 0.9em;">
        Payment plans are available on a per echo basis only. 
        That means you will have to choose a separate payment plan for each
        echo you want access to. 
      </p>
    </section>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
